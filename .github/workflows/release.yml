name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # 建 Release、传附件要写权限
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve artifact version
        id: version
        run: |
          code=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/config/version.go)
          [ -n "$code" ] || { echo "::error::无法读取代码版本"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="$GITHUB_REF_NAME"
          else
            ver="v${code}-${GITHUB_SHA:0:7}"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      # CGO_ENABLED=0：SQLite 用的是 modernc.org/sqlite（纯 Go），
      # 所以交叉编译不需要各平台的 C 工具链，直接 GOOS/GOARCH 就行。
      - name: Cross compile
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          ver="$VERSION"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/gemrelay_${ver}_${os}_${arch}"
            [ "$os" = "windows" ] && bin="$out.exe" || bin="$out"
            echo "building $bin"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$bin" ./cmd/gemrelay
          done
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # 手动构建也保留二进制与校验和，不创建或修改正式 Release。
      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: gemrelay-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      # 从 CHANGELOG.md 抽出本 tag 对应的那一节，拼进 Release 说明。
      # 抽法：从 `## <版本号>` 那行的下一行起，到下一个 `## ` 之前。
      # 抽不到（没写 CHANGELOG）就留空，靠下面 generate_release_notes 的提交列表兜底。
      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF_NAME#v}"
          {
            section=$(awk -v v="$ver" '$0=="## "v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
            if [ -n "$section" ]; then
              echo
              echo "## 更新日志"
              echo "$section"
            fi
          } > release_body.md
          cat release_body.md

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
          generate_release_notes: true
          body_path: release_body.md
